[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ops-composer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "ansible-core>=2.18,<2.20",
  "ansible-runner>=2.4,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=45,<47",
  "fastapi[standard]>=0.116,<1",
  "psycopg[binary,pool]>=3.2.9,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
auth = []

[project.scripts]
ops-composer = "ops_composer.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ops_composer"]

[tool.fastapi]
entrypoint = "ops_composer.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ops_composer"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ops_composer"]
plugins = ["pydantic.mypy"]
