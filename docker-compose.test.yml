name: ops-composer-test

services:
  ssh:
    build:
      context: ./infra/ssh-test
    environment:
      TEST_SSH_PASSWORD: ${TEST_SSH_PASSWORD:?set a disposable SSH test password}
    ports:
      - "127.0.0.1:${TEST_SSH_PORT:-22222}:22"
    healthcheck:
      test: ["CMD-SHELL", "sshd -t"]
      interval: 2s
      timeout: 2s
      retries: 20
