name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/app
      POSTGRES_PASSWORD: ci-postgres-password
      APP_ALLOWED_ORIGINS: http://localhost:5173
      APP_AUTH_RATE_LIMIT_SECRET: ci-rate-limit-secret-at-least-32-bytes
      FORWARDED_ALLOW_IPS: 127.0.0.1
      PROJECT_FORGE_DESTRUCTIVE_PG_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply migrations
        working-directory: backend
        run: |
          uv sync --frozen --all-groups --extra auth
          uv run --frozen --no-sync ops-composer migrate up
      - name: Validate generated project
        env:
          HARNESS_STRICT: "1"
          HARNESS_DOCKER: "1"
        run: python harness/check.py

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - name: Audit locked backend environment
        working-directory: backend
        run: |
          uv sync --frozen --all-groups --extra auth
          uv run --frozen --no-sync pip-audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
